
[package]
name = "davinci_chess"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1"
crossbeam = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
dashmap = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.9"


tch = "0.24.0"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
